<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#0F766E;--accent-hover:#115E59;--accent-soft:rgba(15,118,110,.28);--accent-bg:#F0FDFA;--bg-primary:#F6F8FC;--bg-secondary:#FFFFFF;--bg-card:#FFFFFF;--bg-elevated:#F1F5F9;--card-visual:#F1F4F9;--wave:#CBD5E1;--band-default:#0F766E;--band-hover:#115E59;--band-done:#059669;--band-gold:#D4A853;--band-gold-hover:#BC9242;--rank-grad-from:#D1FAE5;--rank-grad-to:#FFFFFF;--gold:#D4A853;--today-sep:#E6ECF4;--text-strong:#060F17;--list-hover:#F8FAFC;--text-primary:#0B1A26;--text-secondary:#475569;--text-weak:#94A3B8;--border:#E6ECF4;--shadow-sm:0 1px 2px rgba(11,26,38,.04);--shadow-md:0 24px 60px rgba(0,0,0,.06);--shadow-lg:0 24px 60px rgba(0,0,0,.10);--focus-ring:0 0 0 3px rgba(15,118,110,.22);--radius-card:12px;--radius-pop:16px;--radius-pill:40px;--ease-elastic:cubic-bezier(0.34,1.56,0.64,1);--transition-normal:0.38s var(--ease-elastic)}

.theme-switch:focus-visible{box-shadow:var(--focus-ring)}

.card-placeholder{pointer-events:none}

.resources-grid.list-view .card-body{flex:1;padding:0;min-width:0}
.resources-grid.list-view .resource-title{font-size:1rem;margin-bottom:4px}
.resources-grid.list-view .resource-meta{margin-bottom:0;font-size:.85rem}
.resources-grid.list-view .resource-meta .meta-weak,
.resources-grid.list-view .resource-meta .meta-sep{display:none}
.resources-grid.list-view .card-body{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;row-gap:2px}
.resources-grid.list-view .resource-title{margin-bottom:0}

.resources-grid.list-view .skeleton-visual{display:none}
.resources-grid.list-view .card-placeholder{display:flex;align-items:center;gap:18px;padding:14px 18px;border-bottom:1px solid var(--border);border-radius:var(--radius-card);background:transparent;box-shadow:none}
.resources-grid.list-view .skeleton-body{padding:0;flex:1}
.card-rank{display:none;font-family:ui-monospace,Consolas,monospace;font-size:.85rem;color:var(--text-weak);width:34px;flex-shrink:0;font-variant-numeric:tabular-nums}
.today-section{margin-bottom:0}

.hidden{display:none!important}

.kbd-hint.visible{opacity:1;visibility:visible}

.toast-icon{color:var(--accent)}

.loader{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:var(--bg-primary);transition:opacity .25s ease,visibility .25s ease}

@keyframes loaderBreath{0%{opacity:.2;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes loaderHalo{0%{transform:scale(.5);opacity:.35}100%{transform:scale(1.8);opacity:0}}
@media (max-width:768px){.header-inner{padding:10px 16px;gap:10px}.logo{font-size:1rem}.search-area{gap:10px}.filter-pill{padding:0 14px}.container{padding:10px 16px 24px}.resources-grid{gap:18px;grid-template-columns:1fr}.today-item{min-width:140px;padding:0 14px}.kbd-hint{display:none}}
@media (max-width:480px){.card-body{padding:14px}.resource-title{font-size:1rem}}
@media (max-width:560px){.filter-pill span{display:none}.filter-pill{padding:0;width:46px;justify-content:center}}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="loader-inner"><span class="loader-halo"></span><i class="fas fa-music loader-note"></i></div></div>

<header class="site-header"><div class="header-inner">
  <div class="header-left">
    <a href="#" class="logo" id="logoHome"></a>
    <p class="result-stats" id="resultStats">加载中...</p>
  </div>
  <div class="search-area">
    <div class="search-wrapper"><i class="fas fa-search search-icon"></i><input type="text" class="search-input" id="searchInput" autocomplete="off" placeholder=""><button class="search-clear" id="searchClear" aria-label="清除搜索"><i class="fas fa-times"></i></button></div>
    <button class="filter-pill" id="filterBtn" aria-haspopup="true" aria-expanded="false"><i class="fas fa-sliders"></i><span id="filterBtnText">筛选与视图</span></button>
    <div class="filter-dropdown" id="filterDropdown" role="menu" aria-label="筛选与视图">
      <div class="filter-group">
        <div class="filter-group-title">排序方式</div>
        <button class="filter-option active" data-sort="default" role="menuitemradio" aria-checked="true"><span class="sort-opt-default"></span><i class="fas fa-check check"></i></button>
        <button class="filter-option" data-sort="nameAsc" role="menuitemradio" aria-checked="false"><span class="sort-opt-nameAsc"></span><i class="fas fa-check check"></i></button>
        <button class="filter-option" data-sort="nameDesc" role="menuitemradio" aria-checked="false"><span class="sort-opt-nameDesc"></span><i class="fas fa-check check"></i></button>
        <button class="filter-option" data-sort="dateDesc" role="menuitemradio" aria-checked="false"><span class="sort-opt-dateDesc"></span><i class="fas fa-check check"></i></button>
        <button class="filter-option" data-sort="dateAsc" role="menuitemradio" aria-checked="false"><span class="sort-opt-dateAsc"></span><i class="fas fa-check check"></i></button>
      </div>
      <div class="filter-divider"></div>
      <div class="filter-group">
        <div class="filter-group-title">视图模式</div>
        <div class="view-inline">
          <button class="view-opt active" data-view="grid" aria-pressed="true"><i class="fas fa-th-large"></i><span>网格</span></button>
          <button class="view-opt" data-view="list" aria-pressed="false"><i class="fas fa-list"></i><span>列表</span></button>
        </div>
      </div>
      <div class="filter-divider"></div>
      <button class="filter-option" id="randomInFilter" role="menuitem"><i class="fas fa-dice lead"></i><span id="randomBtnText">随机推荐</span></button>
    </div>
  </div>
  <button class="theme-switch" id="themeToggle" aria-label="切换主题"><i class="fas fa-moon" id="themeIcon"></i></button>
</div></header>

<main class="container">
  <section class="today-section" id="todaySection">
    <div class="today-head"><span class="today-title" id="todayTitle"></span></div>
    <div class="today-body">
      <div class="today-list" id="todayScroll"></div>
      <span class="today-date" id="todayDate"></span>
    </div>
  </section>
  <div class="today-divider" id="todayDivider"></div>
  <div id="resourcesGrid" class="resources-grid"></div>
  <div id="emptyState" class="empty-state hidden">
    <div class="empty-art" aria-hidden="true">
      <svg viewBox="0 0 72 72" width="64" height="64" shape-rendering="crispEdges" style="color:var(--text-weak)">
        <rect x="12" y="48" width="30" height="24" fill="currentColor"/>
        <rect x="54" y="0" width="6" height="54" fill="currentColor"/>
      </svg>
    </div>
    <div class="empty-title" id="emptyTitle"></div>
    <div class="empty-desc" id="emptyDesc"></div>
  </div>
</main>

<footer class="site-footer"><div id="copyrightArea" class="copyright"></div><div><span class="runtime" id="runtimeText"></span></div></footer>

<button class="back2top" id="backToTopBtn" aria-label="返回顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
</button>

<div class="kbd-hint" id="kbdHint"><div class="kbd-hint-title"><i class="fas fa-keyboard"></i> <span id="kbdTitle"></span></div><div class="kbd-hint-row"><span><kbd>/</kbd> <span id="kbdSearch"></span></span><span><kbd>Esc</kbd> <span id="kbdEsc"></span></span></div><div class="kbd-hint-row"><span><kbd>G</kbd> <span id="kbdGrid"></span></span><span><kbd>L</kbd> <span id="kbdList"></span></span></div><div class="kbd-hint-row"><span><kbd>T</kbd> <span id="kbdTheme"></span></span><span><kbd>?</kbd> <span id="kbdHelp"></span></span></div><div class="kbd-hint-row"><span><kbd>↑</kbd> <kbd>↓</kbd> <span id="kbdNav"></span></span><span><kbd>Enter</kbd> <span id="kbdEnter"></span></span></div></div>

<div class="toast" id="toast"><i class="fas fa-info-circle toast-icon"></i><span id="toastMsg"></span></div>
<div class="dropdown-backdrop" id="dropdownBackdrop"></div>

<script src="config.js"></script>
<script src="music-data.js"></script>
<script src="text-config.js"></script>
<script>
(function(){
const T=window.MC_TEXT||{};
document.title=T.siteTitle||document.title;
const setTxt=(id,txt)=>{const el=document.getElementById(id);if(el&&txt!=null)el.innerText=txt;};
setTxt('logoHome',T.logoText);
const setSortText=(cls,txt)=>{const el=document.querySelector('.'+cls);if(el&&txt!=null)el.innerText=txt;};
setSortText('sort-opt-default',T.sortDefault);
setSortText('sort-opt-nameAsc',T.sortNameAsc);
setSortText('sort-opt-nameDesc',T.sortNameDesc);
setSortText('sort-opt-dateDesc',T.sortDateDesc);
setSortText('sort-opt-dateAsc',T.sortDateAsc);
setTxt('filterBtnText',T.filterBtnText||'筛选与视图');
setTxt('randomBtnText',T.randomBtnText);
setTxt('kbdTitle',T.kbdTitle);
setTxt('kbdSearch',T.kbdSearch);
setTxt('kbdEsc',T.kbdEsc);
setTxt('kbdGrid',T.kbdGridView);
setTxt('kbdList',T.kbdListView);
setTxt('kbdTheme',T.kbdTheme);
setTxt('kbdHelp',T.kbdHelp);
setTxt('kbdNav',T.kbdNav);
setTxt('kbdEnter',T.kbdEnter);
setTxt('todayTitle',T.todayTitle||'今日歌单');

const D={
  s:document.getElementById('searchInput'),sc:document.getElementById('searchClear'),
  searchWrapper:document.querySelector('.search-wrapper'),
  filterBtn:document.getElementById('filterBtn'),filterDropdown:document.getElementById('filterDropdown'),
  filterSortOpts:document.querySelectorAll('.filter-dropdown .filter-option[data-sort]'),
  filterViewOpts:document.querySelectorAll('.filter-dropdown .view-opt'),
  randomFilter:document.getElementById('randomInFilter'),
  g:document.getElementById('resourcesGrid'),e:document.getElementById('emptyState'),rs:document.getElementById('resultStats'),
  bb:document.getElementById('backToTopBtn'),lg:document.getElementById('logoHome'),tt:document.getElementById('themeToggle'),ti:document.getElementById('themeIcon'),
  et:document.getElementById('emptyTitle'),ed:document.getElementById('emptyDesc'),rt:document.getElementById('runtimeText'),ca:document.getElementById('copyrightArea'),
  kh:document.getElementById('kbdHint'),toast:document.getElementById('toast'),tm:document.getElementById('toastMsg'),
  backdrop:document.getElementById('dropdownBackdrop'),
  todaySection:document.getElementById('todaySection'),todayList:document.getElementById('todayScroll'),todayDate:document.getElementById('todayDate'),todayDivider:document.getElementById('todayDivider')};

const appConfig=window.appConfig||{};
const startDateStr=appConfig.startDate;
const copyrightText=appConfig.copyright;
if(copyrightText&&typeof copyrightText==='string'&&copyrightText.trim()!=='')D.ca.innerHTML=copyrightText;else D.ca.style.display='none';
let startDate=null;
if(startDateStr&&typeof startDateStr==='string'){let p=new Date(startDateStr);if(!isNaN(p.getTime()))startDate=p;}
function updateRuntime(){if(!startDate){if(D.rt.parentElement)D.rt.parentElement.style.display='none';return;}const now=new Date(),diff=now-startDate;if(diff<0){D.rt.textContent='时间旅行中...';return;}const ts=Math.floor(diff/1000),dd=Math.floor(ts/86400),hh=Math.floor((ts%86400)/3600),mm=Math.floor((ts%3600)/60),ss=ts%60;D.rt.textContent=(T.runtimePrefix||'已运行')+' '+dd+'天 '+hh+'小时 '+mm+'分钟 '+ss+'秒';}
function initRuntime(){if(!startDate){if(D.rt.parentElement)D.rt.parentElement.style.display='none';return;}updateRuntime();setInterval(updateRuntime,1000);}

const S={keyword:'',sort:'default',view:'grid',musicData:null,filteredSorted:[],currentFocusIndex:-1,isTyping:false,isSwitchingView:false};
const sortMap={default:T.sortDefault,nameAsc:T.sortNameAsc,nameDesc:T.sortNameDesc,dateDesc:T.sortDateDesc,dateAsc:T.sortDateAsc};
let obs=null,debTimer=null,toTimer=null;
const deb=(fn,d)=>{clearTimeout(debTimer);debTimer=setTimeout(fn,d);};
const esc=s=>s?s.replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'):'';
const escRegex=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const highlight=(t,k)=>{if(!k||!t)return esc(t);const kw=k.trim().toLowerCase();if(!kw)return esc(t);const et=esc(t);return et.replace(new RegExp('('+escRegex(kw)+')','gi'),'<mark class="highlight">$1</mark>');};
const toast=(msg,type='info',dur=3000)=>{D.tm.textContent=msg;D.toast.className='toast '+(type?type+' ':'')+'show';const iconMap={info:'fa-info-circle',success:'fa-check-circle',error:'fa-exclamation-circle'};const ic=D.toast.querySelector('.toast-icon');if(ic)ic.className='fas '+(iconMap[type]||iconMap.info)+' toast-icon';clearTimeout(toTimer);toTimer=setTimeout(()=>D.toast.classList.remove('show'),dur);};
function triggerDownload(url,btn){if(!url||url==='#')return;if(btn.classList.contains('loading')||btn.classList.contains('success'))return;btn.classList.add('loading');const sp=btn.querySelector('span'),orig=sp?sp.textContent:T.downloadBtnText;if(sp)sp.textContent=T.downloadPreparing;
  const card=btn.closest('.resource-card');const band=card&&card.querySelector('.card-band');const rk=card&&card.querySelector('.card-rank-num');if(rk){rk.classList.remove('flash');void rk.offsetWidth;rk.classList.add('flash');}
  setTimeout(()=>{btn.classList.remove('loading');btn.classList.add('success');const ic=btn.querySelector('i');if(ic)ic.className='fas fa-check';if(sp)sp.textContent=T.downloadComplete;window.open(url,'_blank');if(band)band.classList.add('downloaded');setTimeout(()=>{btn.classList.remove('success');if(ic)ic.className='fas fa-download';if(sp)sp.textContent=orig;},1800);},600);}
const getSorted=a=>{const c=[...a];switch(S.sort){case'nameAsc':c.sort((x,y)=>(x.title||'').localeCompare(y.title||'','zh'));break;case'nameDesc':c.sort((x,y)=>(y.title||'').localeCompare(x.title||'','zh'));break;case'dateDesc':c.sort((x,y)=>new Date(y.date||0)-new Date(x.date||0));break;case'dateAsc':c.sort((x,y)=>new Date(x.date||0)-new Date(y.date||0));break;default:c.sort((x,y)=>(x.id||0)-(y.id||0));}return c;};
const rankHTML=n=>{const s=String(n).padStart(2,'0');const d=s.split('');const single=n<10;const cls='card-rank-num'+(single?' is-single':' dual');const inner=d.map((c,i)=>{if(single&&c==='0'&&i===0)return'<span class="rank-zero">0</span>';let k='rank-digit';if(!single){if(i===0)k+=' rank-tens';if(i===d.length-1)k+=' rank-units';}return'<span class="'+k+'">'+c+'</span>';}).join('');return'<span class="'+cls+'">'+inner+'</span>';};
const getCard=(i,idx)=>{const kw=S.keyword.trim();const th=kw?highlight(i.title,kw):esc(i.title);const ah=kw?highlight(i.author,kw):esc(i.author);const sz=esc(i.size||'未知');const dt=esc(i.date||'-');const n=idx+1;return'<article class="resource-card" tabindex="0" data-index="'+idx+'" data-id="'+(i.id||idx)+'" aria-label="'+esc(i.title)+' 作者 '+esc(i.author)+'"><span class="card-rank">'+String(n).padStart(2,'0')+'</span><div class="card-band">'+rankHTML(n)+'</div><div class="card-body"><h3 class="resource-title">'+th+'</h3><div class="resource-meta"><span class="meta-author">'+ah+'</span><span class="meta-sep">·</span><span class="meta-weak">'+dt+'</span><span class="meta-sep">·</span><span class="meta-weak">'+sz+'</span></div></div><button class="btn-download" data-url="'+esc(i.downloadUrl||'#')+'" aria-label="下载 '+esc(i.title)+'"><i class="fas fa-download"></i></button></article>';};
const bindEvents=()=>{D.g.querySelectorAll('.btn-download').forEach(btn=>{if(btn.dataset.listener)return;const url=btn.getAttribute('data-url');btn.addEventListener('click',function(e){e.preventDefault();triggerDownload(url,this);});btn.dataset.listener='true';});D.g.querySelectorAll('.resource-card').forEach(c=>{if(c.dataset.keyInit!=='1'){c.dataset.keyInit='1';c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.querySelector('.btn-download')?.click();}});}});};
const loadCard=idx=>{const ph=document.querySelector('.card-placeholder[data-index="'+idx+'"]');if(!ph||ph.dataset.loaded==='true')return;const it=S.filteredSorted[idx];if(!it)return;ph.outerHTML=getCard(it,idx);bindEvents();};
const initObs=()=>{if(obs)obs.disconnect();obs=new IntersectionObserver(entries=>{entries.forEach(e=>{const idx=parseInt(e.target.getAttribute('data-index'));if(!isNaN(idx)&&e.isIntersecting)loadCard(idx);});},{rootMargin:'200px 0px',threshold:0.01});document.querySelectorAll('.card-placeholder').forEach(el=>obs.observe(el));};
const rebuild=()=>{if(!S.filteredSorted.length){D.g.innerHTML='';D.g.classList.add('hidden');D.e.classList.remove('hidden');D.rs.textContent=T.statsZero||'';return;}D.g.classList.remove('hidden');D.e.classList.add('hidden');D.rs.textContent='共 '+S.filteredSorted.length+' 首作品';let html='';for(let i=0;i<S.filteredSorted.length;i++){html+='<div class="card-placeholder skeleton-card" data-index="'+i+'"><div class="skeleton-visual"></div><div class="skeleton-body"><div class="skeleton-title"></div><div class="skeleton-meta"></div><div class="skeleton-meta short"></div></div></div>';}D.g.innerHTML=html;if(S.view==='list')D.g.classList.add('list-view');else D.g.classList.remove('list-view');if(obs)obs.disconnect();initObs();};
function enhanceWithPinyin(data){if(!window.pinyinPro)return data;return data.map(item=>{if(!item._pinyin){try{const pT=window.pinyinPro.pinyin(item.title,{toneType:'none',type:'array'}).join('').toLowerCase();const pA=window.pinyinPro.pinyin(item.author,{toneType:'none',type:'array'}).join('').toLowerCase();item._pinyin={title:pT,author:pA};}catch(e){item._pinyin={title:'',author:''};}}return item;});}
function generateDailyPlaylist(data){if(!data||!data.length)return[];const today=new Date();const ds=today.getFullYear()+'.'+String(today.getMonth()+1).padStart(2,'0')+'.'+String(today.getDate()).padStart(2,'0');if(D.todayDate)D.todayDate.textContent=ds;let seed=0;const key=ds.replace(/\./g,'');for(let i=0;i<key.length;i++)seed+=key.charCodeAt(i);const rng=(max)=>Math.floor((seed=(seed*9301+49297)%233280)/233280*max);const count=Math.min(6,data.length);const shuffled=[...data];for(let i=shuffled.length-1;i>0;i--){const j=rng(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}return shuffled.slice(0,count);}
function todayDownload(url,title){if(!url||url==='#'){toast(T.toastLinkInvalid||'链接无效','error',1500);return;}window.open(url,'_blank');toast('已开始下载《'+title+'》','success',1500);}
function renderDailyPlaylist(playlist){if(!D.todayList)return;const show=!!(playlist&&playlist.length);if(D.todaySection)D.todaySection.style.display=show?'':'none';if(D.todayDivider)D.todayDivider.style.display=show?'':'none';if(!show){D.todayList.innerHTML='';return;}let html='';playlist.forEach(song=>{const safeTitle=esc(song.title),safeAuthor=esc(song.author),url=song.downloadUrl||'#';html+='<button class="today-item" data-url="'+esc(url)+'" data-title="'+safeTitle+'" aria-label="'+safeTitle+' '+safeAuthor+'"><span class="today-item-title" title="'+safeTitle+'">'+safeTitle+'</span><span class="today-item-author" title="'+safeAuthor+'">'+safeAuthor+'</span></button>';});D.todayList.innerHTML=html;D.todayList.querySelectorAll('.today-item').forEach(item=>{const url=item.getAttribute('data-url'),title=item.getAttribute('data-title');let clickTimer=null;item.addEventListener('click',()=>{if(clickTimer)return;clickTimer=setTimeout(()=>{clickTimer=null;toast(T.todayClickHint||'双击即可下载','info',1500);},260);});item.addEventListener('dblclick',()=>{if(clickTimer){clearTimeout(clickTimer);clickTimer=null;}todayDownload(url,title);});});}
function randomRecommend(){
  if(!S.musicData||!S.musicData.length){toast(T.toastNoRecommend||'暂无推荐','error');return;}
  D.s.value='';S.keyword='';D.sc.classList.remove('visible');refresh();
  const randomIndex=Math.floor(Math.random()*S.musicData.length);
  const targetSong=S.musicData[randomIndex];
  let targetCard=null;
  const cards=document.querySelectorAll('.resource-card');
  for(let i=0;i<cards.length;i++){const cardId=cards[i].getAttribute('data-id');if(cardId==targetSong.id||cards[i].querySelector('.resource-title')?.innerText===targetSong.title){targetCard=cards[i];break;}}
  if(targetCard){
    const headerHeight=document.querySelector('.site-header').offsetHeight;
    const elementPosition=targetCard.getBoundingClientRect().top+window.scrollY;
    window.scrollTo({top:elementPosition-headerHeight-20,behavior:'smooth'});
    const originalShadow=targetCard.style.boxShadow;
    targetCard.style.boxShadow='0 0 0 3px var(--accent-soft),0 10px 25px rgba(0,0,0,0.12)';
    setTimeout(()=>{targetCard.style.boxShadow=originalShadow;},1500);
    toast('随机推荐成功：'+targetSong.title,'success');
  }else{
    D.s.value=targetSong.title;S.keyword=targetSong.title;D.sc.classList.toggle('visible',true);refresh();
    toast('随机推荐成功：'+targetSong.title,'success');
  }
}
const updateRender=()=>{if(!S.musicData||!Array.isArray(S.musicData)){S.filteredSorted=[];D.g.classList.add('hidden');D.e.classList.remove('hidden');D.et.textContent=T.emptyTitleDefault||'暂无数据';D.ed.textContent=T.emptyDescDefault||'';D.rs.textContent=T.statsZero||'';return;}let filtered=S.musicData;if(S.keyword.trim()){const kw=S.keyword.trim().toLowerCase();filtered=S.musicData.filter(item=>{const mT=item.title.toLowerCase().includes(kw),mA=item.author.toLowerCase().includes(kw),mPT=item._pinyin&&item._pinyin.title.includes(kw),mPA=item._pinyin&&item._pinyin.author.includes(kw);return mT||mA||mPT||mPA;});}S.filteredSorted=getSorted(filtered);if(!S.filteredSorted.length){D.g.classList.add('hidden');D.e.classList.remove('hidden');D.et.textContent=(T.emptyTitleNoResult&&T.emptyTitleNoResult.trim())?T.emptyTitleNoResult:'没有找到相关作品';D.ed.textContent=(T.emptyDescNoResult&&T.emptyDescNoResult.trim())?T.emptyDescNoResult:'还没找到？试试换个关键词吧';D.rs.textContent=T.statsZero||'';return;}rebuild();};
const refresh=()=>updateRender();
const setView=(newView)=>{if(S.view===newView||S.isSwitchingView)return;S.isSwitchingView=true;D.g.classList.add('view-transition');setTimeout(()=>{S.view=newView;const isList=newView==='list';D.g.classList.toggle('list-view',isList);D.filterViewOpts.forEach(o=>{const on=o.dataset.view===newView;o.classList.toggle('active',on);o.setAttribute('aria-pressed',on);});setTimeout(()=>{D.g.classList.remove('view-transition');S.isSwitchingView=false;},50);},150);toast(isList?T.viewSwitchMsgList:T.viewSwitchMsgGrid);};

D.s.placeholder=window.innerWidth<=380?(T.searchPlaceholderSmall||''):(T.searchPlaceholder||'搜索音乐指令…');
D.s.addEventListener('input',()=>{S.keyword=D.s.value;S.isTyping=true;D.sc.classList.toggle('visible',S.keyword.length>0);deb(()=>{S.isTyping=false;refresh();},150);});
D.s.addEventListener('focus',()=>D.searchWrapper.classList.add('focused'));
D.s.addEventListener('blur',()=>D.searchWrapper.classList.remove('focused'));
D.sc.addEventListener('click',()=>{D.s.value='';S.keyword='';D.sc.classList.remove('visible');refresh();D.s.focus();});
const closeFilter=()=>{D.filterDropdown.classList.remove('show');D.backdrop.classList.remove('show');D.filterBtn.classList.remove('active');D.filterBtn.setAttribute('aria-expanded','false');};
D.filterBtn.addEventListener('click',e=>{e.stopPropagation();const open=!D.filterDropdown.classList.contains('show');D.filterDropdown.classList.toggle('show',open);D.backdrop.classList.toggle('show',open);D.filterBtn.classList.toggle('active',open);D.filterBtn.setAttribute('aria-expanded',open);if(open)setTimeout(()=>D.filterSortOpts[0]?.focus(),100);});
D.filterSortOpts.forEach(opt=>{opt.addEventListener('click',()=>{D.filterSortOpts.forEach(o=>{o.classList.remove('active');o.setAttribute('aria-checked','false');});opt.classList.add('active');opt.setAttribute('aria-checked','true');S.sort=opt.dataset.sort;closeFilter();refresh();});});
D.filterViewOpts.forEach(btn=>{btn.addEventListener('click',()=>{const v=btn.dataset.view;closeFilter();setView(v);});});
D.randomFilter.addEventListener('click',()=>{closeFilter();randomRecommend();});
document.addEventListener('click',e=>{if(!D.filterDropdown.contains(e.target)&&!D.filterBtn.contains(e.target))closeFilter();});
D.backdrop.addEventListener('click',closeFilter);
D.lg.addEventListener('click',e=>{e.preventDefault();D.s.value='';S.keyword='';D.sc.classList.remove('visible');S.sort='default';D.filterSortOpts.forEach(o=>{o.classList.remove('active');o.setAttribute('aria-checked','false');});document.querySelector('.filter-option[data-sort="default"]')?.classList.add('active');document.querySelector('.filter-option[data-sort="default"]')?.setAttribute('aria-checked','true');refresh();window.scrollTo({top:0,behavior:'smooth'});});
window.addEventListener('scroll',()=>{D.bb.classList.toggle('visible',window.scrollY>400);},{passive:true});
D.bb.addEventListener('click',()=>{window.scrollTo({top:0,behavior:'smooth'});});

let khTimer=null;const showKbd=(dur=4000)=>{D.kh.classList.add('visible');clearTimeout(khTimer);khTimer=setTimeout(()=>D.kh.classList.remove('visible'),dur);};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'){if(e.key==='Escape')e.target.blur();return;}
  if(e.key==='?'||e.key==='？'){e.preventDefault();showKbd();return;}
  if(e.key==='/'){e.preventDefault();D.s.focus();D.s.select();return;}
  if(e.key==='t'||e.key==='T'){e.preventDefault();D.tt.click();return;}
  if(e.key==='g'||e.key==='G'){e.preventDefault();setView('grid');return;}
  if(e.key==='l'||e.key==='L'){e.preventDefault();setView('list');return;}
  const cards=D.g.querySelectorAll('.resource-card');
  if(cards.length){
    if(e.key==='ArrowDown'||e.key==='j'||e.key==='J'){e.preventDefault();S.currentFocusIndex=Math.min(S.currentFocusIndex+1,cards.length-1);cards[S.currentFocusIndex]?.focus();cards[S.currentFocusIndex]?.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
    if(e.key==='ArrowUp'||e.key==='k'||e.key==='K'){e.preventDefault();S.currentFocusIndex=Math.max(S.currentFocusIndex-1,0);cards[S.currentFocusIndex]?.focus();cards[S.currentFocusIndex]?.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
    if(e.key==='Home'){e.preventDefault();S.currentFocusIndex=0;cards[0]?.focus();return;}
    if(e.key==='End'){e.preventDefault();S.currentFocusIndex=cards.length-1;cards[cards.length-1]?.focus();return;}
  }
  if(e.key==='Home'&&e.ctrlKey){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});}
});

const setTheme=()=>{const dark=localStorage.getItem('mc_theme')==='dark';document.documentElement.setAttribute('data-theme',dark?'dark':'light');D.ti.className=dark?'fas fa-sun':'fas fa-moon';D.tt.setAttribute('aria-label',dark?'切换为浅色模式':'切换为深色模式');};
const toggleTheme=()=>{const dark=document.documentElement.getAttribute('data-theme')!=='dark';document.documentElement.setAttribute('data-theme',dark?'dark':'light');localStorage.setItem('mc_theme',dark?'dark':'light');D.ti.className=dark?'fas fa-sun':'fas fa-moon';D.tt.setAttribute('aria-label',dark?'切换为浅色模式':'切换为深色模式');toast(dark?(T.themeSwitchMsgDark||'已切换深色'):(T.themeSwitchMsgLight||'已切换浅色'));};
D.tt.addEventListener('click',toggleTheme);setTheme();

const loadMusicData=()=>{if(window.musicData&&Array.isArray(window.musicData)&&window.musicData.length){let valid=window.musicData.every(item=>item.title&&item.author);S.musicData=valid?window.musicData:window.musicData.filter(item=>item.title&&item.author);S.musicData=enhanceWithPinyin(S.musicData);toast((T.dataLoadSuccessPrefix||'已加载')+' '+S.musicData.length+' 首音乐','success');const daily=generateDailyPlaylist(S.musicData);renderDailyPlaylist(daily);}else{S.musicData=null;D.et.textContent=T.dataInvalidTitle||'数据无效';D.ed.textContent=T.dataInvalidDesc||'';toast(T.dataLoadError||'加载失败','error');}refresh();};
window.addEventListener('error',function(e){if(e.target.tagName==='SCRIPT'&&e.target.src&&e.target.src.includes('music-data.js')){S.musicData=null;D.et.textContent=T.scriptLoadErrorTitle||'脚本加载失败';D.ed.textContent=T.scriptLoadErrorDesc||'';D.rs.textContent=T.statsZero||'';toast(T.dataLoadError||'加载失败','error');refresh();}});
const updPlaceholder=()=>{D.s.placeholder=window.innerWidth<=380?(T.searchPlaceholderSmall||''):(T.searchPlaceholder||'搜索音乐指令…');};
window.addEventListener('resize',updPlaceholder);

const removeLoader=()=>{const l=document.getElementById('loader');if(!l)return;l.classList.add('done');setTimeout(()=>{l.style.display='none';},450);};
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',()=>{updPlaceholder();initRuntime();loadMusicData();setTimeout(removeLoader,1500);});}else{updPlaceholder();initRuntime();loadMusicData();setTimeout(removeLoader,1500);}

try{if(!localStorage.getItem('mc_kbd_seen')){showKbd(3000);localStorage.setItem('mc_kbd_seen','1');}}catch(e){}
})();
</script>
</body>
</html>
